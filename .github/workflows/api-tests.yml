name: API tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    services:
      backend:
        image: andrewshabailov/bank_api:latest
        ports:
          - 4111:4111

    env:
      BASE_URL: http://localhost:4111/api
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for backend
        run: |
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:4111; do
            echo "backend is not up yet..."; sleep 3; done'

      - name: Run tests
        run: pytest --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/